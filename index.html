      id: 1, zone: 'harbor', title: 'Hello, container.', subtitle: 'Your first message from the other side.', minutes: 4, xp: 100, topic: 'run', icon: 'terminal',
      brief: 'Welcome aboard, cadet. Before we launch the fleet, make sure the engine is awake. Inspect the Docker version, then run the hello-world image to send your first signal.',
      objectives: [{ text: 'Inspect your Docker installation', test: 'version' }, { text: 'Run the hello-world container', test: 'hello' }],
      hints: ['The version command tells you about the client and the engine.', 'Use docker run followed by an image name.', 'docker version\ndocker run hello-world'],
      solution: ['docker version', 'docker run hello-world'], flag: 'DOCK{first_contact}',
      lesson: 'An image is a read-only blueprint. A container is a running (or stopped) instance of that blueprint. Docker downloads a missing image, creates a container, and runs its main process. When that process finishes, the container stops.',

    {
      id: 2, zone: 'harbor', title: 'Blueprints, not boxes', subtitle: 'Collect an image without running it.', minutes: 4, xp: 100, topic: 'image', icon: 'layers',

      hints: ['Image tags pick a specific version. Write them after a colon.', 'Pull downloads an image; images lists your local inventory.', 'docker pull alpine:3.20\ndocker images'],
      solution: ['docker pull alpine:3.20', 'docker images'], flag: 'DOCK{blueprint_collected}',
      lesson: 'Images consist of cached, read-only filesystem layers and configuration. A tag such as 3.20 is a human-readable reference; tags can change. Pulling an image stores it locally. Creating a container adds its own writable layer.',

    {
      id: 3, zone: 'harbor', title: 'Keep the light on', subtitle: 'Start a service in the background.', minutes: 5, xp: 125, topic: 'run', icon: 'play',

      hints: ['Detached mode lets the container run while your terminal is free.', 'Use -d for detached mode and --name for a memorable name.', 'docker run -d --name lighthouse nginx:alpine\ndocker ps'],
      solution: ['docker run -d --name lighthouse nginx:alpine', 'docker ps'], flag: 'DOCK{lighthouse_online}',
      lesson: 'The -d flag detaches your terminal from the container. The container keeps running while its main process is alive. A name makes it easier to refer to that container. docker ps shows running containers; docker ps -a includes stopped ones.',

      hints: ['A stopped container still has a filesystem and metadata.', 'The -a option includes stopped containers. Inspect gives detailed JSON.', 'docker ps -a\ndocker inspect cargo'],
      solution: ['docker ps -a', 'docker inspect cargo'], flag: 'DOCK{nothing_is_lost}',
      lesson: 'Stopped does not mean deleted. The container keeps its configuration and writable layer until you remove it. Inspect reveals its state, image, mounts, environment, and networking. A zero exit code usually means successful completion.',

    },

  function closeModal() { $('#modal').close(); }
  function about() {
    modal(`<p class="modal-copy">You’re a cadet in a container harbor. Work through 16 missions, capture their flags, and earn your way to fleet captain.</p><div class="setting-row"><div><strong>01 · Learn by doing</strong><small>Read the briefing. Enter commands in the practice terminal.</small></div>${icon('terminal')}</div><div class="setting-row"><div><strong>02 · See how it works</strong><small>Play the explainer or step through the animated diagram.</small></div>${icon('layers')}</div><div class="setting-row"><div><strong>03 · Capture your flag</strong><small>Complete the objectives, run claim, and submit the token.</small></div>${icon('flag')}</div><p class="modal-copy" style="margin-top:16px">The game runs entirely on this device. The Docker engine, image pulls, and HTTP requests are simulated. It never executes commands on your computer. Your progress saves automatically; export it for a backup.</p><p class="modal-copy" style="margin-top:10px">Use Download offline game to save the complete game as one HTML file. Open that file in your browser whenever you want to play without a connection.</p><div class="modal-actions"><button class="button" data-action="close-modal">Let’s explore ${icon('arrow')}</button></div>`, 'Welcome aboard.');
  }
  function settings() {
    modal(`<label class="setting-row"><div><strong>Animated explanations</strong><small>Turn motion off to advance diagrams manually.</small></div><input type="checkbox" id="motion-setting" ${progress.motion ? 'checked' : ''}></label><div class="setting-row"><div><strong>Progress backup</strong><small>Take your voyage to another browser or device.</small></div></div><div class="modal-actions"><button class="button secondary" data-action="export">${icon('download')}Export progress</button><button class="button secondary" data-action="import">${icon('upload')}Import progress</button></div><div class="modal-actions"><button class="button secondary" data-action="download-game">${icon('download')}Download offline game</button></div>${!storageOK ? '<p class="storage-warning">Browser storage is unavailable. Export before closing the app.</p>' : ''}<hr class="modal-divider"><p class="modal-copy">Resetting your campaign clears all flags, XP, lab states, and achievements on this browser. Export a backup first if you want to keep them.</p><div class="modal-actions"><button class="button danger small" data-action="confirm-reset">Reset campaign</button></div><input class="file-input" type="file" id="progress-file" accept="application/json,.json">`, 'Make it your voyage.');
  }
  function downloadGame() {
    // Save only the original shell and embedded code; progress is backed up separately.
    const copy = document.documentElement.cloneNode(true);
    copy.querySelector('#app')?.replaceChildren();
    const toastElement = copy.querySelector('#toast');
    if (toastElement) { toastElement.replaceChildren(); toastElement.className = 'toast'; }
    const dialog = copy.querySelector('#modal');
    if (dialog) { dialog.replaceChildren(); dialog.removeAttribute('open'); dialog.removeAttribute('aria-label'); }
    copy.querySelectorAll('.confetti').forEach(element => element.remove());
    copy.querySelector('body')?.removeAttribute('class');
    const title = copy.querySelector('title');
    if (title) title.textContent = 'Docker Quest — Learn. Build. Ship.';
    const blob = new Blob(['<!doctype html>\n', copy.outerHTML], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'docker-quest.html';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Offline game downloaded. Open the HTML file in your browser to play anywhere.');
  }
  function exportProgress() {
    save(); const payload = { ...progress, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), link = document.createElement('a'); link.href = url; link.download = 'docker-quest-progress.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Progress exported. Keep this file as your voyage backup.');
  }
  async function importProgress(file) {
    if (!file) return;
    try {
      if (file.size > 2_000_000) throw new Error('This file is too large. Progress files must be smaller than 2 MB.');
      const incoming = sanitize(JSON.parse(await file.text()));
      modal(`<p class="modal-copy">This backup contains <strong>${incoming.completed.length} completed missions</strong>. Importing will replace the progress currently saved in this browser.</p><div class="modal-actions"><button class="button" id="apply-import">Import this backup</button><button class="button secondary" data-action="close-modal">Cancel</button></div>`, 'Restore your voyage?');
      $('#apply-import').addEventListener('click', () => { progress = incoming; engine = null; mission = null; view = 'campaign'; closeModal(); save(); render(); toast('Progress restored. Welcome back aboard.'); }, { once: true });
    } catch (error) { toast('Could not import: ' + error.message); }
  }
  async function copyCommand(text) {
    try { if (!navigator.clipboard?.writeText) throw new Error('Unavailable'); await navigator.clipboard.writeText(text); toast('Command copied.'); }
    catch { modal(`<p class="modal-copy">Select this command and copy it with Ctrl+C (or your device’s copy action).</p><input style="width:100%;margin-top:15px;padding:11px;background:#112015;border:1px solid #536d41;border-radius:7px;color:var(--lime);font:11px var(--mono)" aria-label="Command to copy" id="copy-fallback" readonly value="${escape(text)}">`, 'Copy a command'); $('#copy-fallback').select(); }
  }
  function celebrate() {
    if (!progress.motion || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const wrap = document.createElement('div'); wrap.className = 'confetti'; wrap.setAttribute('aria-hidden', 'true');
    const colors = ['#c6f27c', '#95cddd', '#eab591', '#b7a2e4'];
    wrap.innerHTML = Array.from({ length: 38 }, (_, i) => `<i style="--left:${Math.random() * 100}%;--color:${colors[i % 4]};--duration:${2 + Math.random() * 2}s;--delay:${Math.random() * .5}s"></i>`).join(''); document.body.append(wrap); setTimeout(() => wrap.remove(), 5000);
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]'); if (!button || button.disabled) return;
    const action = button.dataset.action;
    switch (action) {
      case 'nav': navigate(button.dataset.view); break;
      case 'home': event.preventDefault(); navigate('campaign'); break;
      case 'mission': document.body.classList.remove('menu-open'); openMission(button.dataset.id); break;
      case 'menu': document.body.classList.toggle('menu-open'); syncMenu(); break;
      case 'about': about(); break;
      case 'settings': settings(); break;
      case 'close-modal': closeModal(); break;
      case 'next': closeModal(); openMission(button.dataset.id); break;
      case 'show-achievements': closeModal(); navigate('achievements'); break;
      case 'download-game': downloadGame(); break;
      case 'export': exportProgress(); break;
      case 'import': $('#progress-file')?.click(); break;
      case 'copy': copyCommand(button.dataset.command); break;
      case 'recipe': $('#command-input').value = button.dataset.command; $('#command-input').focus(); break;
      case 'hint': if (mission) { progress.hints[mission.id] = Math.min((progress.hints[mission.id] || 0) + 1, 3); renderHints(); save(); } break;
      case 'animate': if (playing) { stopAnimation(); drawAnimation(); } else playAnimation(); break;
      case 'frame': stopAnimation(); frame = Number(button.dataset.frame); drawAnimation(); break;
      case 'next-frame': stopAnimation(); frame = (frame + 1) % 4; drawAnimation(); break;
      case 'reset-lab': modal(`<p class="modal-copy">This will restore this ${mission ? 'mission' : 'sandbox'} to its starting state and clear its command history. Earned flags and XP are kept.</p><div class="modal-actions"><button class="button" data-action="apply-lab-reset">Reset lab</button><button class="button secondary" data-action="close-modal">Keep practicing</button></div>`, 'A fresh workspace?'); break;
      case 'apply-lab-reset': closeModal(); stopAnimation(); loadLab(true); save(); render(); toast('Lab reset. A clean slate awaits.'); break;
      case 'confirm-reset': modal(`<p class="modal-copy">All ${progress.completed.length} captured flags, ${xp()} XP, and saved lab states will be cleared in this browser.</p><div class="modal-actions"><button class="button danger" data-action="apply-reset">Clear all progress</button><button class="button secondary" data-action="close-modal">Keep my voyage</button></div>`, 'Reset your campaign?'); break;
      case 'apply-reset': closeModal(); progress = defaults(); engine = null; mission = null; view = 'campaign'; save(); render(); toast('Campaign reset. Your adventure starts here.'); break;
    }
  });
  document.addEventListener('submit', event => {
    if (event.target.id === 'command-form') { event.preventDefault(); runCommand($('#command-input').value); }
    if (event.target.id === 'flag-form') { event.preventDefault(); captureFlag($('#flag-input').value); }
  });
  document.addEventListener('input', event => { if (event.target.id === 'guide-search') { search = event.target.value; $('#guide-grid').innerHTML = guideCards(); } });
  document.addEventListener('change', event => {
    if (event.target.id === 'motion-setting') { progress.motion = event.target.checked; document.body.classList.toggle('motion-off', !progress.motion); stopAnimation(); drawAnimation(); save(); }
    if (event.target.id === 'progress-file') importProgress(event.target.files[0]);
  });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && document.body.classList.contains('menu-open')) { document.body.classList.remove('menu-open'); syncMenu(); $('.mobile-menu')?.focus(); } });
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopAnimation(); drawAnimation(); save(); } });
  render();

})();

</script>
</body>
</html>
